name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: whisper.cpp holen
        run: ./scripts/fetch-whisper.sh

      - name: Tests
        run: swift test --skip WhisperIntegrationTests

      - name: App bauen
        run: ARCHS=arm64 ./scripts/build-app.sh
