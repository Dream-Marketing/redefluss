name: Windows

# Baut und testet die Windows-Version (windows/). Bei einem Tag v* kommen ZIP und Setup.exe
# zum selben GitHub-Release wie DMG und ZIP der Mac-Version (das legt release.yml an).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test windows/tests/Redefluss.Core.Tests --nologo

      - name: Inno Setup bereitstellen
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Bauen + Paketieren
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-probe' }
          ./windows/scripts/publish.ps1 -Version $version

      # Fängt Fehler ab, die erst beim Start auffallen (Tests und Build sehen sie nicht).
      - name: Starttest
        run: |
          $log = "$env:LOCALAPPDATA\Redefluss\logs\redefluss.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process windows/publish/win-x64/Redefluss.exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $p.HasExited
          if (Test-Path $log) { Get-Content $log } else { Write-Host "Kein Protokoll geschrieben." }
          if ($alive) { Stop-Process -Id $p.Id -Force } else { Write-Host "Beendet mit Code $($p.ExitCode)" }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-2) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Redefluss' } | ForEach-Object { $_.Message }
          if (-not $alive) { throw "Redefluss hat sich beim Start beendet" }
          if (-not (Test-Path $log) -or (Select-String -Path $log -Pattern ' FEHLER ' -Quiet)) { throw "Startfehler im Protokoll" }

      - name: Probelauf-Artefakte
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: redefluss-windows
          path: windows/dist/*
          retention-days: 7

      - name: Zum Release hinzufügen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Das Release legt der Mac-Job an – kurz darauf warten.
          for ($i = 0; $i -lt 40; $i++) {
            gh release view $env:GITHUB_REF_NAME *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem windows/dist/* | ForEach-Object FullName) --clobber
