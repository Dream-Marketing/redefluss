name: Release

# Neues Release: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: whisper.cpp holen
        run: ./scripts/fetch-whisper.sh

      - name: Tests
        run: swift test --skip WhisperIntegrationTests

      # Stabile, selbstsignierte Identität (scripts/create-signing-identity.sh) aus den Secrets.
      # Damit behalten Nutzer ihre Bedienungshilfen-Freigabe über Updates hinweg.
      # Ohne Secrets wird ad-hoc signiert.
      - name: Signatur-Identität einrichten
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12_BASE64" ]; then
            echo "Keine Signatur-Secrets – ad-hoc-Signatur."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 16)"
          echo "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # codesign akzeptiert das selbstsignierte Zertifikat nur, wenn es vertrauenswürdig ist.
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin "pass:$SIGNING_P12_PASSWORD" -nokeys -legacy 2>/dev/null \
            | openssl x509 -out "$RUNNER_TEMP/signing.pem" \
            || openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin "pass:$SIGNING_P12_PASSWORD" -nokeys \
            | openssl x509 -out "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/signing.p12"
          echo "SIGN_IDENTITY=Redefluss Open Source" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: App bauen (Universal)
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: DMG + ZIP
        run: ./scripts/package.sh

      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Installation

          1. **Redefluss-VERSION.dmg** herunterladen, öffnen und Redefluss in **Programme** ziehen.
          2. Beim ersten Öffnen blockiert macOS die App (sie ist nicht bei Apple notarisiert):
             **Systemeinstellungen → Datenschutz & Sicherheit → „Trotzdem öffnen"**.
             Alternativ im Terminal: `xattr -dr com.apple.quarantine /Applications/Redefluss.app`
          3. Der Einführung folgen: Mikrofon + Bedienungshilfen erlauben, Sprachmodell laden (~574 MB, einmalig).

          Dann: **Fn halten → sprechen → loslassen.** Doppeltipp auf Fn = Dauer-Modus.

          Kein Konto, keine Cloud – alles läuft lokal mit whisper.cpp.
          EOF
          sed -i '' "s/VERSION/$VERSION/g" "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/Redefluss-*.dmg dist/Redefluss-*.zip \
            --title "Redefluss $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
